<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08080c">
  <title>1v1.LOL — Game Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08080c;
    }

    .webgl-content {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(900px 620px at 72% 12%, rgba(122, 54, 139, 0.22), transparent 65%),
        #08080c;
    }

    #gameContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #gameContainer canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .vault-back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10000;
      padding: 7px 10px;
      border: 1px solid rgba(248, 236, 217, 0.22);
      border-radius: 7px;
      background: rgba(12, 8, 12, 0.74);
      color: #f8ecd9;
      font: 650 11px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .vault-back:hover {
      border-color: rgba(243, 180, 95, 0.55);
      background: rgba(35, 22, 27, 0.92);
    }

    .vault-back:focus-visible {
      outline: 2px solid #f3b45f;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>

  <a class="vault-back" href="../">← Game Vault</a>

  <script src="1firebase-app.js"></script>
  <script src="1firebase-auth.js"></script>
  <script src="1firebase-firestore.js"></script>
  <script src="1firebase.js"></script>
  <script src="1firestore.js"></script>
  <script src="1login.js"></script>
  <script src="2.7.js"></script>
  <script src="UnityProgress.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "2.7.json", {
      onProgress: UnityProgress
    });
  </script>
</body>
</html>
