<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Baldi's Basics — Game Vault</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #231f20;
    }

    .webgl-content {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #231f20;
    }

    #unityContainer {
      width: min(960px, 100vw) !important;
      height: min(600px, 100vh) !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameContainer {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
    }

    #gameContainer canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .vault-back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10000;
      padding: 7px 10px;
      border: 1px solid rgba(248, 236, 217, 0.22);
      border-radius: 7px;
      background: rgba(12, 8, 12, 0.74);
      color: #f8ecd9;
      font: 650 11px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }

    .vault-back:hover { border-color: rgba(243, 180, 95, 0.55); }
    .vault-back:focus-visible { outline: 2px solid #f3b45f; outline-offset: 2px; }
  </style>
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="baldi.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "baldi.json", {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function () {
          UnityProgress(gameInstance, "complete");
        }
      }
    });
  </script>
</head>
<body style="margin: 0;">
  <div class="webgl-content">
    <div id="unityContainer">
      <div id="gameContainer"></div>
    </div>
  </div>
  <script src="firebase-app.js"></script>
  <a class="vault-back" href="../">← Game Vault</a>
</body>
</html>
