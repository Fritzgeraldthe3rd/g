<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bad Piggies — Game Vault</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .webgl-content {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #gameContainer {
      width: min(960px, 100vw);
      height: min(600px, calc(100vh - 43px));
    }

    .vault-back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10000;
      padding: 7px 10px;
      border: 1px solid rgba(248, 236, 217, 0.22);
      border-radius: 7px;
      background: rgba(12, 8, 12, 0.74);
      color: #f8ecd9;
      font: 650 11px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }

    .vault-back:hover { border-color: rgba(243, 180, 95, 0.55); }
    .vault-back:focus-visible { outline: 2px solid #f3b45f; outline-offset: 2px; }
  </style>
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Bad Piggies.json", { onProgress: UnityProgress });
  </script>
</head>
<body style="background-color:black;">
  <div class="webgl-content">
    <div id="gameContainer"></div>
    <div class="footer">
      <div class="webgl-logo"></div>
      <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
      <div class="title">Bad Piggies · Web build</div>
    </div>
  </div>
  <a class="vault-back" href="../">← Game Vault</a>
</body>
</html>
